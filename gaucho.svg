<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Asistente Braun">
  <defs>
    <clipPath id="circulo"><circle cx="64" cy="64" r="64"/></clipPath>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbe3b8"/>
      <stop offset="0.62" stop-color="#f6d08f"/>
      <stop offset="0.63" stop-color="#d9a441"/>
      <stop offset="1" stop-color="#b8832a"/>
    </linearGradient>
    <linearGradient id="poncho" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c22424"/>
      <stop offset="1" stop-color="#8f1414"/>
    </linearGradient>
    <linearGradient id="cara" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e7ae83"/>
      <stop offset="0.7" stop-color="#dd9d6f"/>
      <stop offset="1" stop-color="#c9855a"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#circulo)">
    <!-- Fondo: atardecer sobre el campo -->
    <rect width="128" height="128" fill="url(#cielo)"/>
    <g transform="translate(64 66) scale(1.28) translate(-64 -64)">

    <!-- Poncho salteño: rojo con guardas negras -->
    <path d="M12 128 C16 104 36 92 64 92 C92 92 112 104 116 128 Z" fill="url(#poncho)"/>
    <path d="M22 128 C25 110 38 100 52 97" stroke="#1b1412" stroke-width="5" fill="none"/>
    <path d="M106 128 C103 110 90 100 76 97" stroke="#1b1412" stroke-width="5" fill="none"/>
    <path d="M30 128 C32 113 41 105 52 102" stroke="#1b1412" stroke-width="1.6" fill="none" opacity="0.8"/>
    <path d="M98 128 C96 113 87 105 76 102" stroke="#1b1412" stroke-width="1.6" fill="none" opacity="0.8"/>

    <!-- Cuello -->
    <path d="M55 84 L55 97 Q64 102 73 97 L73 84 Z" fill="#c47f55"/>

    <!-- Pañuelo al cuello, anudado -->
    <path d="M48 93 Q64 103 80 93 L76 100 Q64 108 52 100 Z" fill="#f3ead6"/>
    <path d="M60 101 L56 116 L64 110 L72 116 L68 101 Z" fill="#f3ead6"/>
    <circle cx="64" cy="102" r="4" fill="#e2d5ba"/>
    <path d="M52 100 Q64 108 76 100" stroke="#d6c6a3" stroke-width="1.2" fill="none"/>

    <!-- Orejas -->
    <ellipse cx="45" cy="66" rx="4.5" ry="6.5" fill="#d48f62"/>
    <ellipse cx="83" cy="66" rx="4.5" ry="6.5" fill="#c9855a"/>

    <!-- Cara -->
    <path d="M46 54 Q45 92 64 95 Q83 92 82 54 Z" fill="url(#cara)"/>

    <!-- Patillas -->
    <path d="M46 52 L46 70 Q48 72 50 68 L50 52 Z" fill="#3a2a20"/>
    <path d="M82 52 L82 70 Q80 72 78 68 L78 52 Z" fill="#3a2a20"/>

    <!-- Cejas -->
    <path d="M52 58 Q57 55 61 58" stroke="#3a2a20" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <path d="M67 58 Q71 55 76 58" stroke="#3a2a20" stroke-width="2.6" fill="none" stroke-linecap="round"/>

    <!-- Ojos (achinados, de sonrisa) -->
    <path class="ojo-ia" d="M53 64 Q57 61 60 64" stroke="#2a1d16" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path class="ojo-ia" d="M68 64 Q71 61 75 64" stroke="#2a1d16" stroke-width="2.4" fill="none" stroke-linecap="round"/>

    <!-- Nariz -->
    <path d="M64 63 Q60.5 72 62.5 75 Q64.5 76.5 67 74.5" stroke="#b3714a" stroke-width="1.8" fill="none" stroke-linecap="round"/>

    <!-- Mejillas -->
    <circle cx="51.5" cy="74" r="3.6" fill="#d9775a" opacity="0.35"/>
    <circle cx="76.5" cy="74" r="3.6" fill="#d9775a" opacity="0.35"/>

    <!-- Bigote tupido -->
    <path d="M46 81 Q50 75 58 77 Q62 76 64 79 Q66 76 70 77 Q78 75 82 81 Q79 87 72 84.5 Q67 82.5 64 83.5 Q61 82.5 56 84.5 Q49 87 46 81 Z" fill="#3a2a20"/>
    <!-- Sonrisa -->
    <path d="M58.5 88 Q64 91.5 69.5 88" stroke="#8a4130" stroke-width="1.8" fill="none" stroke-linecap="round"/>

    <!-- Sombrero de ala ancha -->
    <path d="M43 50 Q42 30 64 28 Q86 30 85 50 Z" fill="#2c221d"/>
    <rect x="43" y="43" width="42" height="6" fill="#8b5a2b"/>
    <ellipse cx="64" cy="51" rx="40" ry="8" fill="#3a2d26"/>
    <ellipse cx="64" cy="49.5" rx="40" ry="6.5" fill="#2c221d"/>

    <!-- Mano con el mate -->
    <g transform="translate(-12 0)">
    <ellipse cx="96" cy="118" rx="9" ry="7" fill="#d48f62"/>
    <path d="M86 98 Q85 116 96 117 Q107 116 106 98 Z" fill="#7a4a24"/>
    <ellipse cx="96" cy="98" rx="10" ry="3.6" fill="#5c3518"/>
    <ellipse cx="96" cy="97.6" rx="7.5" ry="2.2" fill="#3e6b2f"/>
    <rect x="86" y="98" width="20" height="3" fill="#c9c9c9"/>
    <path d="M97 98 L103 82" stroke="#d9d9d9" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M102 82 L106 80" stroke="#d9d9d9" stroke-width="2.4" stroke-linecap="round"/>
    </g>
    </g>
  </g>
</svg>
